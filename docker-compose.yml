services:
  spotify-mcp:
    build: .
    restart: unless-stopped
    environment:
      MCP_TRANSPORT: http
      MCP_AUTH: token
      MCP_HTTP_HOST: 0.0.0.0
      MCP_HTTP_PORT: "3000"
      MCP_API_TOKEN: ${MCP_API_TOKEN:?Set MCP_API_TOKEN}
      SPOTIFY_CLIENT_ID: ${SPOTIFY_CLIENT_ID:?Set SPOTIFY_CLIENT_ID}
      SPOTIFY_CLIENT_SECRET: ${SPOTIFY_CLIENT_SECRET:?Set SPOTIFY_CLIENT_SECRET}
      SPOTIFY_REDIRECT_URI: ${SPOTIFY_REDIRECT_URI:?Set SPOTIFY_REDIRECT_URI}
      SPOTIFY_USER_ID: ${SPOTIFY_USER_ID:-}
      SPOTIFY_TOKEN_FILE: /app/data/spotify-tokens.json
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - spotify-data:/app/data
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      retries: 3
volumes:
  spotify-data:
